<section>
<h2>اليوم 1: ما يحيط بالرعاية: الملاحظة وورقة المريض</h2>
<ol>
<li><p>أعلن مورّد «سجل» ميزة جديدة: «يقترح تعديل جرعة الإنسولين من قراءات السكر التي تُذكر في الزيارة». ماذا يتغير؟</p><ul><li><b>أ.</b> لا شيء: ما زال الممارس يراجع الجرعة المقترحة ويوقّع</li><li><b>ب.</b> صار غرضها تدبير علاج: يُسأل المورّد عن إذن التسويق</li><li><b>ج.</b> لا شيء ما دامت الخوادم داخل المملكة والاتفاقية سارية</li><li><b>د.</b> تُشغَّل الميزة للمرضى المستقرين فقط، بعد مراجعة الممارس</li></ul></li>
<li><p>في نص الزيارة: «هل ما زلت تأخذين الأسبرين؟» «لا، أوقفته قبل شهر». وفي الملاحظة: «تستمر على الأسبرين». ما نوع الخطأ؟</p><ul><li><b>أ.</b> إسقاط</li><li><b>ب.</b> اختلاق</li><li><b>ج.</b> نفي</li><li><b>د.</b> جرعة</li></ul></li>
<li><p>أربعة أخطاء في ملاحظة مريض سكري على الأقراص. أيها قد يصل ضرره إلى المريض مباشرة لو عُمل بالملاحظة كما هي؟</p><ul><li><b>أ.</b> كُتب أنه يسكن وحده، ولم يقل ذلك أحد في الزيارة</li><li><b>ب.</b> كُتب أن إعتام العدسة في العين اليسرى، وهو في اليمنى</li><li><b>ج.</b> كُتب أنه أُحيل إلى أخصائي التغذية، ولم يُحَل إليه</li><li><b>د.</b> بقيت جرعة الغليبنكلاميد القديمة، وقد خُفضت بعد هبوط</li></ul></li>
<li><p>ورقة المصدر تقول: حبة واحدة في الصباح، ويشرب المريض ماء كافيًا، ويوقف الدواء مؤقتًا عند الإسهال ويتصل بالعيادة. أي جملة من مسودة الورقة تخالف المصدر؟</p><ul><li><b>أ.</b> «خذ حبتين كل يوم في الصباح»</li><li><b>ب.</b> «يُنصح بالإكثار من شرب الماء»</li><li><b>ج.</b> «عند الإسهال يوقف الدواء مؤقتًا ويُتصل بالعيادة»</li><li><b>د.</b> «يزيد الدواء الإفراغ البولي للغلوكوز»</li></ul></li>
<li><p>راجعت ملاحظة صاغها مساعد التدوين سطرًا سطرًا، ووجدت أن لكل سطر فيها أصلًا في نص الزيارة. أي خطأ قد يبقى فيها دون أن تراه؟</p><ul><li><b>أ.</b> اختلاق: فحص لم يُجرَ كُتب أنه أُجري</li><li><b>ب.</b> إسقاط: حساسية دوائية ذكرها المريض</li><li><b>ج.</b> جانب: يمين صار يسارًا في الإحالة</li><li><b>د.</b> جرعة: مقدار غير ما قيل في الزيارة</li></ul></li>
<li><p>في الملاحظة: «نُصح المريض بحمية قليلة الملح». قرأت نص الزيارة كاملًا فلم تجد ذكرًا للملح ولا للحمية. ما نوع الخطأ؟</p><ul><li><b>أ.</b> نفي</li><li><b>ب.</b> إسقاط</li><li><b>ج.</b> اختلاق</li><li><b>د.</b> جرعة</li></ul></li>
<li><p>وجدت أربعة أخطاء في ملاحظة واحدة وأمامك دقيقتان قبل المريض التالي. أيها تصحح أولًا؟</p><ul><li><b>أ.</b> كُتب أن المريض متقاعد، وهو ما زال يعمل</li><li><b>ب.</b> كُتب ألم الركبة في اليمنى، وهو في اليسرى</li><li><b>ج.</b> سقطت من الملاحظة إحالة إلى أخصائي التغذية</li><li><b>د.</b> كُتبت جرعة الوارفارين 15 ملغ، وقيل 5 ملغ</li></ul></li>
<li><p>زميل يقول: «أراجع ملاحظات المساعد كلها في آخر الدوام، وأعرف مرضاي جيدًا». ما أضعف نقطة في طريقته؟</p><ul><li><b>أ.</b> مصدره صار ذاكرته بعد ساعات وعشرين مريضًا</li><li><b>ب.</b> المراجعة في آخر الدوام تأخذ وقتًا أطول من غيرها</li><li><b>ج.</b> المساعد يخطئ أكثر في الملاحظات الأخيرة من اليوم</li><li><b>د.</b> معرفة المرضى تغني عن المراجعة سطرًا سطرًا</li></ul></li>
<li><p>صاغ المساعد ورقة للمريض من ورقة المصدر. اللغة صعبة، وتشك في رقم واحد. ما الترتيب الصحيح؟</p><ul><li><b>أ.</b> تطلب من المساعد تبسيطها، ثم تراجع النص المبسط</li><li><b>ب.</b> تصحح الدقة مقابل المصدر، ثم تبسّط، ثم تطابق من جديد</li><li><b>ج.</b> تبسّطها بنفسك، ولا حاجة إلى المصدر بعد ذلك</li><li><b>د.</b> تصحح الرقم الذي تشك فيه وتعطيها للمريض</li></ul></li>
<li><p>في مسودة ورقة المريض جملة: «هذا الدواء يساعد على إنقاص الوزن». لا سطر لها في ورقة المصدر، وأنت تعرف أنها صحيحة في الغالب. ماذا تفعل؟</p><ul><li><b>أ.</b> تبقيها: المعلومة صحيحة وتشجع المريض</li><li><b>ب.</b> تبقيها وتضيف كلمة «قد»</li><li><b>ج.</b> تحذفها: كل ما في الورقة يعود إلى سطر في المصدر</li><li><b>د.</b> تسأل المساعد من أين جاء بها وتبقيها إن أعطاك مرجعًا</li></ul></li>
<li><p>راجعتَ النسخة العربية مقابل المصدر، ثم طلبت من المساعد ترجمتها إلى الإنجليزية. ما الذي لم تتحقق منه بعد؟</p><ul><li><b>أ.</b> لا شيء: العربية صحيحة والإنجليزية ترجمتها</li><li><b>ب.</b> النحو الإنجليزي وعلامات الترقيم فقط</li><li><b>ج.</b> هل النسخة الإنجليزية قصيرة بما يكفي للمريض</li><li><b>د.</b> أن كل حقيقة من المصدر صحيحة في الإنجليزية</li></ul></li>
<li><p>سلّمت المريض ورقة دوائه الجديد. أي سؤال يخبرك هل أدّت الورقة عملها؟</p><ul><li><b>أ.</b> «بكلماتك: ماذا تفعل إن أصابك قيء بعد الدواء؟»</li><li><b>ب.</b> «هل فهمت كل ما في الورقة عن دوائك الجديد؟»</li><li><b>ج.</b> «هل عندك أي سؤال عن الدواء قبل أن تغادر؟»</li><li><b>د.</b> «هل قرأت الورقة كلها، وهل الخط واضح لك؟»</li></ul></li>
<li><p>عرض مورّد على عيادتك تطبيقًا يقول في نشرته: «يتنبأ بخطر هبوط السكر في الأيام القادمة من قراءات المريض». ما أول سؤال تسأله؟</p><ul><li><b>أ.</b> هل واجهته بالعربية وسهلة الاستخدام؟</li><li><b>ب.</b> كم يوفر من وقت الزيارة الواحدة؟</li><li><b>ج.</b> هل له إذن تسويق جهازًا طبيًا؟</li><li><b>د.</b> هل يراجع الطبيب كل تنبؤاته؟</li></ul></li>
<li><p>تعيد تصميم كتابة ملاحظة الزيارة بمساعد تدوين، وعليك أن تبقي خطوة واحدة دون مساعد. أي خطوة تحفظ مهارتك أكثر؟</p><ul><li><b>أ.</b> طباعة الملاحظة وحفظها في الملف</li><li><b>ب.</b> تصحيح الأخطاء الإملائية في المسودة</li><li><b>ج.</b> اختيار قالب الملاحظة وترتيب أقسامها</li><li><b>د.</b> كتابة الخطة بيدك قبل أن ترى المسودة</li></ul></li>
<li><p>زميل يقول: «منذ استخدمت المساعد صارت ملاحظاتي أسرع وأدق». لم يقس شيئًا قبل أن يبدأ. ما الذي يستطيع قوله بصدق؟</p><ul><li><b>أ.</b> أن انطباعه كذلك، ولا يعرف الفرق حتى يقيس</li><li><b>ب.</b> أن الملاحظات أسرع بالتأكيد وأدق في الغالب</li><li><b>ج.</b> أن الدقة تحسنت لأن المساعد لا ينسى</li><li><b>د.</b> لا شيء: القياس مستحيل بعد أن بدأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الدليل عند مصدره، والبيانات الصحية</h2>
<ol>
<li><p>زميلة طابقت مسودة ورقة المريض بورقة المصدر وصححتها، ثم طلبت من المساعد تبسيطها، ثم سلّمتها للمريض. ما الذي فاتها؟</p><ul><li><b>أ.</b> أن تترجم الورقة إلى الإنجليزية</li><li><b>ب.</b> أن تحسب مستوى القراءة بعد التبسيط</li><li><b>ج.</b> أن تطابق النص المبسط بالمصدر من جديد</li><li><b>د.</b> أن تسأل المساعد هل غيّر شيئًا</li></ul></li>
<li><p>مساعد الأدلة: «38% من مقاطع نظام تحويل الكلام إلى نص فيها عبارات مختلقة (Koenecke وآخرون 2024)». فتحت الورقة: نحو 1% من المقاطع فيها عبارات مختلقة، و38% من هذه الاختلاقات فيها ضرر صريح.</p><ul><li><b>أ.</b> يخالف المصدر، مع أن الرقم 38% موجود فيه</li><li><b>ب.</b> يطابق المصدر: الرقم 38% موجود في الملخص</li><li><b>ج.</b> المصدر غير موجود: الورقة ليست في السجلات</li><li><b>د.</b> المصدر قديم: الرقم لم يعد صالحًا اليوم</li></ul></li>
<li><p>جواب سؤالك يقوم على تجربة عشوائية واحدة كبيرة، على مرضى يشبهون مرضاك، نُشرت قبل تسع سنوات. لم تبحث عما نُشر بعدها. أي بيان تكتب؟</p><ul><li><b>أ.</b> عالٍ، لأنها تجربة عشوائية كبيرة على مرضى يشبهون مرضاي</li><li><b>ب.</b> منخفض، لأن كل تجربة واحدة ضعيفة مهما كان حجمها</li><li><b>ج.</b> لا يُكتب بيان حتى توجد مراجعة منهجية في السؤال</li><li><b>د.</b> متوسط: تجربة قوية واحدة، ولم أبحث عما نُشر بعدها</li></ul></li>
<li><p>ممرضة تريد مسودة خطاب إحالة لمريض إلى عيادة القدم، وفيه اسمه وتاريخه. أمامها الأدوات الثلاث ببطاقاتها. ماذا تختار؟</p><ul><li><b>أ.</b> المساعد العام، بعد حذف الاسم من الخطاب</li><li><b>ب.</b> «سجل»، فغرضه يشمل الإحالة ويقبل الهوية</li><li><b>ج.</b> «يقين»، لأن له اتفاقية مع العيادة</li><li><b>د.</b> أي أداة، ما دام المريض وافق على العلاج</li></ul></li>
<li><p>مقتطف لحالة تعليمية: «رجل في الخمسينات من بلدة صغيرة، سكري من النوع الثاني على الميتفورمين، يعمل قائدًا لفرقة الإطفاء في بلدته». أي جزء تغيّره أولًا؟</p><ul><li><b>أ.</b> المهنة مع البلدة</li><li><b>ب.</b> الفئة العمرية</li><li><b>ج.</b> نوع السكري</li><li><b>د.</b> اسم الدواء</li></ul></li>
<li><p>مساعد الأدلة: «خفض الدواء السكتة الدماغية 30% (تجربة منشورة، برقمها في PubMed)». فتحت السجل: الرقم 30% موجود، وهو لدخول المستشفى بسبب فشل القلب. والسكتة: لا فرق ذو دلالة. ما حكمك على الادعاء؟</p><ul><li><b>أ.</b> يطابق المصدر: الرقم موجود في التجربة</li><li><b>ب.</b> المصدر غير موجود في سجلات PubMed</li><li><b>ج.</b> يخالف المصدر: رقم صحيح على نتيجة أخرى</li><li><b>د.</b> المصدر قديم ولا يصلح اليوم</li></ul></li>
<li><p>ذكر المساعد مقالًا في مجلة باسم معقول وسنة وأرقام صفحات. بحثت في PubMed بالعنوان وبالمؤلف وبالمجلة فلم تجد شيئًا. ماذا تكتب في بطاقة الدليل؟</p><ul><li><b>أ.</b> «المصدر غير موجود»، ويسقط الادعاء الذي بُني عليه</li><li><b>ب.</b> المرجع كما ذكره المساعد: قد يكون في قاعدة بيانات أخرى</li><li><b>ج.</b> «يطابق المصدر» إن كان الادعاء معقولًا سريريًا</li><li><b>د.</b> تطلب من المساعد مرجعًا بديلًا وتكتبه</li></ul></li>
<li><p>جواب السؤال يقوم على مراجعة منهجية جيدة المنهج، وآخر بحث لها في قواعد البيانات كان قبل خمس عشرة سنة. كيف يظهر ذلك في بطاقتك؟</p><ul><li><b>أ.</b> لا يظهر في البطاقة، فالمراجعة المنهجية أعلى الأدلة وتكفي</li><li><b>ب.</b> تُسقط المراجعة من البطاقة لقدمها، وتبحث عن مصدر آخر</li><li><b>ج.</b> تكتب سنة النشر وحدها، وتبقي درجة اليقين كما هي</li><li><b>د.</b> تكتب تاريخ آخر بحث، وتخفض اليقين، وتكتب ما لم تتحقق منه</li></ul></li>
<li><p>سؤالك عن مريضة عمرها 78 سنة مصابة بالسكري منذ عشرين سنة وعندها قصور كلوي. المساعد يستشهد بتجربة أُجريت على مرضى حديثي التشخيص متوسط عمرهم 53 سنة. ما الحكم؟</p><ul><li><b>أ.</b> يطابق المصدر: الأرقام صحيحة في التجربة</li><li><b>ب.</b> صحيح في مصدره، لا ينطبق على السؤال</li><li><b>ج.</b> المصدر غير موجود في السجلات</li><li><b>د.</b> يخالف المصدر</li></ul></li>
<li><p>عندك نتائج تحاليل طويلة لمريض وتريد ملخصًا. الأقرب إليك مساعد محادثة عام بحسابك الشخصي المجاني. ما الذي يمنع؟</p><ul><li><b>أ.</b> لا شيء إن حذفت اسم المريض فقط</li><li><b>ب.</b> أن الملخص قد يكون أطول مما تريد أو أقل دقة</li><li><b>ج.</b> لا اتفاقية مع جهتك، والبيانات صحية معرِّفة</li><li><b>د.</b> أن المساعد العام لا يفهم نتائج التحاليل الطبية</li></ul></li>
<li><p>تريد أن تسأل مساعد الأدلة عن هدف السكر التراكمي لمريضك. أي صيغة تحمل أقل ما يكفي؟</p><ul><li><b>أ.</b> اسم المريض ورقم ملفه وتاريخه كاملًا ليكون الجواب دقيقًا</li><li><b>ب.</b> ملف المريض بعد حذف الاسم</li><li><b>ج.</b> «رجل عمره 62 سنة، سكري منذ 12 سنة، ومرض قلبي وعائي»</li><li><b>د.</b> السؤال بلا أي صفة: «ما هدف السكر التراكمي؟»</li></ul></li>
<li><p>مقتطف لحالة تعليمية حُذف منه الاسم ورقم الهوية والجوال، وبقي فيه: العمر 43، والحي، والمهنة «مدرب صقور»، وتاريخ الزيارة باليوم. هل يُعرف صاحبه؟</p><ul><li><b>أ.</b> لا: حُذفت كل المعرِّفات المباشرة من المقتطف</li><li><b>ب.</b> لا، إلا لمن يملك ملفه الطبي الكامل</li><li><b>ج.</b> نعم، لكن فقط إن أُضيف إليه التشخيص والأدوية</li><li><b>د.</b> نعم: الحقول مجتمعة قد تطابق شخصًا واحدًا</li></ul></li>
<li><p>استبدلت بأسماء المرضى رموزًا، وحفظت جدول الرموز والأسماء في ملف آخر. هل ما زال الملف بيانات شخصية؟</p><ul><li><b>أ.</b> لا: لا اسم فيه</li><li><b>ب.</b> نعم: من يملك الجدول يعيد كل رمز إلى صاحبه</li><li><b>ج.</b> لا، إن حُفظ الجدول في مجلد آخر</li><li><b>د.</b> نعم، لكن فقط إن كانت الرموز أرقامًا متسلسلة</li></ul></li>
<li><p>خط أساسك: 14 دقيقة، و10 حقائق صحيحة من 10، ولا أخطاء. بمساعدة المساعد: 6 دقائق، و9 حقائق من 10، وخطأ جرعة بقي بعد مراجعتك. ما قرارك في بطاقة إعادة التصميم؟</p><ul><li><b>أ.</b> أعتمد التصميم: وفّر أكثر من نصف الوقت</li><li><b>ب.</b> أعتمده، وأطلب من المساعد أن يكون أدق</li><li><b>ج.</b> أرفض المساعد نهائيًا في هذه المهمة</li><li><b>د.</b> أعدّل خطوة المراجعة وأعيد التشغيل والقياس</li></ul></li>
</ol>
